name: Build Cartoony APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Cartoony-AnimeGAN-AI-Paprika-small.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Extract Cartoony project
        shell: bash
        run: |
          set -e

          ZIP_FILE="Cartoony-AnimeGAN-AI-Paprika-small.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE was not found."
            exit 1
          fi

          mkdir -p project
          unzip -q -o "$ZIP_FILE" -d project

          echo "Extracted project files:"
          find project -maxdepth 2 -type f | sort | head -100

          if [ ! -f "project/settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle.kts was not found after extraction."
            exit 1
          fi

          if [ ! -f "project/app/build.gradle.kts" ]; then
            echo "ERROR: app/build.gradle.kts was not found after extraction."
            exit 1
          fi

      - name: Build Cartoony Debug APK
        working-directory: project
        shell: bash
        run: |
          set -e
          gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Cartoony-debug-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

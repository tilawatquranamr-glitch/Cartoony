name: Build Cartoony APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Cartoony-AnimeGAN-AI-Paprika-small.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

env:
  GRADLE_VERSION: '8.10.2'
  ANDROID_API: '35'
  ANDROID_BUILD_TOOLS: '35.0.0'

jobs:
  build-apk:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-${ANDROID_API}" "build-tools;${ANDROID_BUILD_TOOLS}"

      - name: Download Gradle
        run: |
          curl -fsSL "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" -o "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP/gradle"
          echo "$RUNNER_TEMP/gradle/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Find project archive
        id: archive
        shell: bash
        run: |
          set -euo pipefail
          archive="$(find . -maxdepth 1 -type f -name 'Cartoony-AnimeGAN-AI-Paprika-small.zip' -print -quit)"
          if [ -z "$archive" ]; then
            echo "لم يتم العثور على Cartoony-AnimeGAN-AI-Paprika-small.zip في جذر المستودع."
            exit 1
          fi
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Extract Android project
        run: |
          rm -rf "$RUNNER_TEMP/cartoony-project"
          mkdir -p "$RUNNER_TEMP/cartoony-project"
          unzip -q "${{ steps.archive.outputs.archive }}" -d "$RUNNER_TEMP/cartoony-project"
          test -f "$RUNNER_TEMP/cartoony-project/settings.gradle.kts"
          test -f "$RUN
